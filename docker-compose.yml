services:
  postgres:
    image: postgres:17-alpine
    container_name: voc_panel_postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voc_panel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-voc_panel}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.2
    container_name: voc_panel_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6382}:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: voc_panel_rabbitmq
    restart: unless-stopped
    ports:
      - '${RABBITMQ_PORT:-5675}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15675}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
